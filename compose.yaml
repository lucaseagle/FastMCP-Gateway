services:
  gateway:
    build:
      context: .
      target: runtime
    command: ["demo"]
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
